# Eine neue Fassung herausbringen ist ab hier ein `git tag v1.2.0 && git push --tags`.
#
# Das Release enthält alles, was zusammengehört:
#   RemoteDesktopAgent.exe   — der Dienst für Windows
#   manifest.json(.sig)      — was der Agent prüft, bevor er sich austauscht
#   remotedesktop.apk        — die Android-App
#
# Der private Signaturschlüssel liegt ausschließlich als Repository-Secret.
# Erzeugt wird das Paar einmal mit `node scripts/release-key.mjs`.
#
# Zu den Fassungen der Aktionen: alle laufen auf Node 24. Node 20 ist seit
# September 2025 abgekündigt, und die Runner zwangen die alten Fassungen zuletzt
# nur noch mit einer Warnung auf die neue Laufzeit — irgendwann ist das ein
# Abbruch statt einer Warnung. Zwei Entscheidungen darin sind nicht die neueste
# Zahl, sondern Absicht:
#
#   download-artifact bleibt auf v7, obwohl es v8 gibt. v8 entpackt nicht mehr
#   pauschal, sondern nach Content-Type, und bricht bei abweichender Prüfsumme
#   ab. Hoch- und Herunterladen auf derselben Hauptfassung zu halten ist hier
#   die einfachere Zusage.
#
#   setup-node bekommt `package-manager-cache: false` — Begründung unten am
#   Schritt.

name: Release

on:
  push:
    tags:
      - 'v*'

  # Der Notausgang. Am 06.08.2026 kam der Tag v1.2.1 nachweislich am Server an
  # (der Tag steht da, annotiert, auf dem richtigen Commit), aber GitHub legte
  # dazu keinen Lauf an — kein fehlgeschlagener, gar keinen. Dagegen hilft von
  # aussen nichts.
  #
  # Damit laesst sich derselbe Ablauf von Hand starten: Reiter „Actions" →
  # „Release" → „Run workflow", und dort oben **den Tag** als Ref waehlen, nicht
  # master. Die Fassung kommt weiterhin aus dem Namen des Refs; der Schritt
  # darunter bricht ab, wenn es kein Tag ist.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          # Seit v5 schaltet setup-node von sich aus ein Abhängigkeits-Caching
          # ein. Hier wäre es bestenfalls wirkungslos: die Paketdateien liegen
          # in `app/` und `clients/android/`, im Wurzelverzeichnis gibt es
          # keine. Ausdrücklich aus, statt sich darauf zu verlassen, dass die
          # Suche ins Leere läuft.
          package-manager-cache: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Fassung aus dem Tag lesen
        id: version
        # Die Prüfung ist wegen des Notausgangs nötig: von Hand gestartet steht
        # als Ref sonst „master" da, und die Fassung hieße dann „master" — in
        # jedem Dateinamen, im Manifest und in der APK.
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Dieser Ablauf gehört auf einen Tag, nicht auf $GITHUB_REF_NAME." >&2
            echo "Beim Starten von Hand oben als Ref den Tag wählen (z. B. v1.2.1)." >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ---- Oberfläche ----------------------------------------------------
      # Sie steckt in beiden Clients: das Windows-Fenster kopiert app/dist
      # mit, die APK bekommt sie über `cap sync`.
      - name: Oberfläche bauen
        run: |
          npm --prefix app ci
          npm --prefix app run build

      # ---- Agent ---------------------------------------------------------
      # Self-contained und als eine Datei: der Zielrechner soll kein .NET
      # installiert haben müssen, und das Tausch-Skript kennt nur eine Datei.
      - name: Agent bauen
        run: |
          dotnet publish agent/RemoteDesktopAgent.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/agent

      # ---- Windows-Oberfläche ---------------------------------------------
      # Die eine .exe, die ein Mensch startet: Tray, Einrichtung und
      # Fernsteuerfenster in einem. Sie baut auch auf Linux
      # (EnableWindowsTargeting), nur laufen tut sie dort nicht. Der Installer
      # packt genau diesen Ordner ein.
      - name: Oberfläche für Windows bauen
        run: |
          dotnet publish desktop/RemoteDesktopClient.csproj \
            -c Release -r win-x64 --self-contained false \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/client
          cd publish && zip -qr client.zip client

      - name: Manifest unterschreiben
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          mkdir -p publish/release
          cp publish/agent/RemoteDesktopAgent.exe publish/release/
          node scripts/sign-manifest.mjs \
            publish/release/RemoteDesktopAgent.exe \
            "${{ steps.version.outputs.value }}" \
            "$(grep -oP 'Protocol\s*=\s*\K\d+' agent/Services/AgentVersion.cs | head -1)" \
            publish/release

      # ---- Android -------------------------------------------------------
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Keystore auspacken
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Ohne Keystore gibt es nur eine Debug-APK, und die lässt sich nicht
        # über eine installierte Release-Fassung drüberlegen. Deshalb wird das
        # Fehlen hier laut, statt still eine unbrauchbare Datei anzuhängen.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 fehlt." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > clients/android/android/release.keystore

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # `working-directory` und nicht `npx --prefix`: Letzteres sagt npm nur, wo
        # das Paket liegt, und lässt das Arbeitsverzeichnis stehen. Capacitor
        # sucht seine Konfiguration aber dort, wo es gestartet wird — im
        # Wurzelverzeichnis findet es keine und meldet, die Android-Plattform sei
        # nicht angelegt. Lokal fällt das nie auf, weil `npm run apk` ohnehin aus
        # diesem Ordner läuft.
        working-directory: clients/android
        run: |
          npm ci
          npx cap sync android
          cd android
          # Sicherheitsnetz: das Repository liegt auf einem CIFS-Mount, auf dem
          # `core.fileMode=false` gilt — Git legt dort jede Datei als 644 ab,
          # auch die mit Shebang. Lokal fällt das nie auf, weil der Mount alles
          # als 777 zeigt; auf dem Runner endet `./gradlew` dann mit 126.
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.value }}" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/publish/release/remotedesktop.apk"

      # Für den zweiten Job, der den Installer baut — der braucht Windows.
      - name: Artefakte weiterreichen
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: publish/
          retention-days: 1

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/release/RemoteDesktopAgent.exe
            publish/release/manifest.json
            publish/release/manifest.json.sig
            publish/release/remotedesktop.apk
            publish/client.zip

  # ---- Installer -------------------------------------------------------
  # Inno Setup läuft nur unter Windows, deshalb ein eigener Job. Er hängt seine
  # .exe an dasselbe Release, das der erste Job angelegt hat.
  installer:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fassung aus dem Tag lesen
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Artefakte holen
        uses: actions/download-artifact@v7
        with:
          name: publish
          path: publish

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        run: |
          iscc installer\RemoteDesktop.iss /DVersion=${{ steps.version.outputs.value }}

      - name: An das Release hängen
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/RemoteDesktop-Setup-${{ steps.version.outputs.value }}.exe
