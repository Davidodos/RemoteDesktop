# Dockhand-Stack "remotedesktop" auf der NAS.
# Ablage: /volume1/docker/dockhand/data/stacks/NAS/remotedesktop/docker-compose.yml
# (root-owned → Änderungen über die Dockhand-Web-UI)

services:
  remotedesktop-hub:
    build:
      context: /volume1/docker/remotedesktop
      dockerfile: hub/Dockerfile
    container_name: remotedesktop-hub
    restart: unless-stopped

    # Pflicht: ohne host-Netz landet das WOL-Magic-Packet im Docker-Netz
    # und erreicht den LAN-Broadcast nie.
    network_mode: host

    environment:
      - HUB_PORT=3080
      - DEVICES_PATH=/config/devices.json
      - STATIC_PATH=/app/public

    volumes:
      # Enthält die Agent-Tokens — read-only gemountet, nie ins Image.
      - /volume1/docker/remotedesktop/devices.json:/config/devices.json:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
